[workspace]
members = [".", "xtask"]
default-members = ["."]

[package]
name = "chvarkov"
version = "0.1.5"
edition = "2024"

[dependencies]
gio = "0.22.6"
glib = "0.22.7"
gtk4 = { version = "0.11.3", features = ["v4_10"] }
libadwaita = { version = "0.9.1", features = ["v1_6"] }
sourceview5 = "0.11.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
gdk4-macos = { version = "0.11", features = ["v4_8"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSSharingService", "NSView", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSGeometry"] }
